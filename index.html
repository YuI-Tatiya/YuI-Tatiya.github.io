<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Name - Portfolio</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            color: #222;
            line-height: 1.6;
        }
        h1 { margin-bottom: 5px; }
        .subtitle { font-size: 1.1rem; color: #555; font-weight: bold; }
        .links { margin: 15px 0 30px 0; }
        .links a { color: #0000ee; text-decoration: none; }
        .links a:hover { text-decoration: underline; }
        .section {
            display: flex;
            border-top: 1px dotted #ccc;
            padding: 20px 0;
        }
        .section-title {
            width: 25%;
            font-weight: bold;
            text-transform: UPPERCASE;
            letter-spacing: 0.5px;
        }
        .section-content { width: 75%; }
        .item { display: flex; justify-content: space-between; margin-bottom: 15px; }
        .item-title { font-weight: bold; }
        .item-date { color: #555; font-size: 0.95rem; }
    </style>
</head>
<body>

    <h1>Your Name</h1>
    <div class="subtitle">Your Title | Your Role</div>
    <div class="links">
        LinkedIn: <a href="#">linkedin.com/in/yourname</a> | 
        GitHub: <a href="#">github.com/yourname</a>
    </div>

    <!-- EXPERIENCE -->
    <div class="section">
        <div class="section-title">EXPERIENCE</div>
        <div class="section-content">
            <div class="item">
                <div><span class="item-title">Position Name</span> - <i>Company Name</i></div>
                <div class="item-date">2025-Present</div>
            </div>
        </div>
    </div>

    <!-- PUBLICATIONS / PROJECTS -->
    <div class="section">
        <div class="section-title">PUBLICATIONS</div>
        <div class="section-content">
            <div class="item">
                <div><a href="#" style="color: blue; font-weight: bold;">Project or Paper Title</a></div>
                <div class="item-date">2025-10-30</div>
            </div>
        </div>
    </div>

</body>
</html>
